name: Publish

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet pack WhiteSands.AgentPlayer.sln -c Release -o artifacts
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: White_Sands_Interactive
      - run: dotnet nuget push artifacts/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate
